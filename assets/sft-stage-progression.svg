<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">SFT version benchmark progression</title>
  <desc id="desc">Grouped bars compare SFT 1, SFT 2, and SFT 3 on MedQA, MedMCQA, AfriMedQA, MedExpQA, NigeriaMedQA, and Triage.</desc>
  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">What each SFT run changed</text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="17" fill="#526174">SFT 2.0 is the current best balance; SFT 3.0 improved triage but reduced all five other scores</text>
